name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Replace Android directory with fresh Flutter project
        run: |
          # Remove existing android directory
          rm -rf android
          # Create fresh Flutter project
          flutter create --project-name nexalink --platforms=android /tmp/flutter_temp
          # Copy the entire android directory from fresh project
          cp -r /tmp/flutter_temp/android .
          
          # Update compileSdkVersion to 34 (required by plugins)
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk = 33/compileSdk = 34/g' android/app/build.gradle
          
          # Update minSdkVersion to 21 (required by mobile_scanner)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk = 19/minSdk = 21/g' android/app/build.gradle
          
          # Copy custom Kotlin files with VPN support
          mkdir -p android/app/src/main/kotlin/com/nexalink/app
          if [ -f android-custom/MainActivity.kt ]; then
            cp android-custom/MainActivity.kt android/app/src/main/kotlin/com/nexalink/app/MainActivity.kt
            echo "Custom MainActivity.kt copied"
          fi
          if [ -f android-custom/NexaLinkVpnService.kt ]; then
            cp android-custom/NexaLinkVpnService.kt android/app/src/main/kotlin/com/nexalink/app/NexaLinkVpnService.kt
            echo "Custom NexaLinkVpnService.kt copied"
          fi
          
          # Update AndroidManifest.xml to register VPN service
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Add VPN service before closing application tag
          sed -i 's|</application>|<service android:name=".NexaLinkVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service></application>|g' "$MANIFEST"
          echo "AndroidManifest.xml updated with VPN service"
          
          echo "Android directory replaced with fresh Flutter project (SDK versions updated: compileSdk=34, minSdk=21)"

      - name: Install dependencies
        run: flutter pub get

      - name: Create fresh Flutter project for testing
        run: |
          flutter create --project-name test_app /tmp/test_app
          cd /tmp/test_app
          flutter build apk --debug
          echo "Fresh Flutter project builds successfully!"
      
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.0
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: "NexaLink v1.1.0 - Full Features"
          body: |
            ## NexaLink v1.1.0 - Toutes les fonctionnalités restaurées
            
            ### ✅ Fonctionnalités complètes:
            - Mode Propriétaire/Invité
            - WireGuard VPN
            - QR code pairing
            - Limites de données par invité
            - Tutoriel d'introduction
            - Graphiques avancés (statistiques)
            - Code PIN de sécurité
            - Widget Android
            - Notifications intelligentes
            - Partage via lien
            - Mode sombre/clair/système
            - Système de mises à jour
            - Mode développeur
            - Détection de vitesse
            - Personnalisation des notifications
            - Alerte de mauvaise connexion
            
            ### 📱 Installation:
            1. Téléchargez le fichier `app-debug.apk`
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez l'installation depuis sources inconnues si nécessaire
            4. Installez et profitez!
            
            🌐 Website: https://leoblanchart92-hub.github.io/NexaLink/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
