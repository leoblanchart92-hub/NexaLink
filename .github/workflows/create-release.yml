name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Add Gradle wrapper and icons
        run: |
          cd android && gradle wrapper && cd ..
          flutter create --project-name nexalink --platforms=android /tmp/flutter_temp
          cp /tmp/flutter_temp/android/app/src/main/res/mipmap-*/* android/app/src/main/res/ 2>/dev/null || true
          cp -r /tmp/flutter_temp/android/app/src/main/res/drawable* android/app/src/main/res/ 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp build/app/outputs/flutter-apk/app-release.apk "NexaLink-v${VERSION}.apk"

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          # Try to read CHANGELOG.md for this version
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "notes=NexaLink v${VERSION}" >> $GITHUB_OUTPUT
            fi
          else
            echo "notes=NexaLink v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: NexaLink v${{ steps.release_notes.outputs.version }}
          body: |
            ## 🚀 NexaLink v${{ steps.release_notes.outputs.version }}
            
            ${{ steps.release_notes.outputs.notes }}
            
            ### 📥 Installation
            1. Téléchargez le fichier `NexaLink-v${{ steps.release_notes.outputs.version }}.apk` ci-dessous
            2. Autorisez l'installation depuis sources inconnues dans les paramètres Android
            3. Ouvrez l'APK pour installer
            
            ### 🔐 Sécurité
            - Chiffrement WireGuard (Curve25519 + ChaCha20)
            - Aucune donnée collectée
            - Code source ouvert et vérifiable
          files: |
            NexaLink-v${{ steps.release_notes.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
