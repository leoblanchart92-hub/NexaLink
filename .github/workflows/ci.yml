name: Tests et APK Android (développement)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: backend
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.10'
          cache: false
      - name: Tests du prototype réseau
        shell: bash
        working-directory: gateway
        run: |
          set +e
          go mod tidy 2>&1 | tee /tmp/gateway-tidy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            go test -v -timeout 90s ./... 2>&1 | tee /tmp/gateway-test.log
            status=${PIPESTATUS[0]}
            if [ -f go.sum ]; then echo "::notice title=GATEWAY_GO_SUM::$(base64 -w0 go.sum)"; fi
          fi
          if [ "$status" -ne 0 ]; then
            cat /tmp/gateway-tidy.log /tmp/gateway-test.log 2>/dev/null | tail -n 80 | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit "$status"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/nexalink-analyze.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do echo "::notice::$line"; done < /tmp/nexalink-analyze.log
          exit "$status"
      - run: flutter test
      - name: Tests unitaires Android natifs
        shell: bash
        run: |
          set +e
          (cd android && ./gradlew testDebugUnitTest) 2>&1 | tee /tmp/nexalink-native.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/nexalink-native.log | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit "$status"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: NexaLink-android-development-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
