name: Tests et APK Android (développement)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: backend
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Tests du prototype réseau
        shell: bash
        working-directory: gateway
        run: |
          set +e
          go mod tidy 2>&1 | tee /tmp/gateway-tidy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            go test -race -v -timeout 120s ./... 2>&1 | tee /tmp/gateway-test.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::notice title=GATEWAY_TEST_LOG::$(base64 -w0 /tmp/gateway-test.log)"
            fi
          fi
          if [ "$status" -ne 0 ]; then
            cat /tmp/gateway-tidy.log /tmp/gateway-test.log 2>/dev/null | tail -n 80 | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit "$status"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Construire la bibliothèque Go Android
        working-directory: gateway
        shell: bash
        run: |
          set +e
          export GOBIN="$RUNNER_TEMP/nexalink-go-bin"
          mkdir -p "$GOBIN" ../android/app/libs
          export PATH="$GOBIN:$PATH"
          {
            go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250520180527-a1d90793fc63 &&
            go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250520180527-a1d90793fc63 &&
            go get golang.org/x/mobile@v0.0.0-20250520180527-a1d90793fc63 &&
            gomobile init &&
            gomobile bind -androidapi 23 -target=android/arm64,android/arm,android/amd64,android/386 -o ../android/app/libs/nexalink-gateway.aar ./mobile
          } 2>&1 | tee /tmp/nexalink-mobile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::notice title=MOBILE_BUILD_LOG::$(tail -c 32000 /tmp/nexalink-mobile.log | base64 -w0)"
          fi
          exit "$status"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/nexalink-analyze.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do echo "::notice::$line"; done < /tmp/nexalink-analyze.log
          exit "$status"
      - run: flutter test
      - name: Tests unitaires Android natifs
        shell: bash
        run: |
          set +e
          (cd android && ./gradlew testDebugUnitTest) 2>&1 | tee /tmp/nexalink-native.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/nexalink-native.log | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit "$status"
      - run: flutter build apk --release
      - name: Vérifier les architectures natives empaquetées
        run: python3 .github/scripts/check-android-abis.py
      - uses: actions/upload-artifact@v4
        with:
          name: NexaLink-android-development-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Activer la virtualisation pour l'émulateur Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test JNI sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-instrumented-test.sh

      - name: Test JNI Android 6 x86
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEXALINK_DIAGNOSTIC_LABEL: android-23-x86
        with:
          api-level: 23
          arch: x86
          disable-animations: true
          script: bash .github/scripts/android-instrumented-test.sh
      - name: Test JNI Android 15 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEXALINK_DIAGNOSTIC_LABEL: android-35-x86_64
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-instrumented-test.sh

      - name: Conserver les journaux JNI et les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexaLink-android-test-diagnostics
          path: test-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
