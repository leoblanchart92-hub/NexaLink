plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.nexalink.app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.nexalink.app'
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Only CI's isolated ARM-translation test selects a single ABI.
        // Normal builds retain their existing multi-ABI configuration.
        if (project.hasProperty('nexalinkTestAbi')) {
            def abi = project.property('nexalinkTestAbi').toString()
            if (!(abi in ['arm64-v8a', 'armeabi-v7a'])) throw new GradleException('Invalid test ABI')
            ndk { abiFilters abi }
        }
    }
    // Deliberately debug-signed; this is a development artifact, not a production release.
    buildTypes { release { signingConfig signingConfigs.debug } }
}
flutter { source '../..' }

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    implementation files('libs/nexalink-gateway.aar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // Flutter integration_test brings an older test runner into debug runtime.
    // Align both configurations to avoid Gradle's consistent-resolution conflict.
    debugImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
